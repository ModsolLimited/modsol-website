<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Form detection</title></head>
<body>
  <!--
    Netlify's build bot parses this file to register the "contact" form.
    It is never rendered to visitors — the real form lives in
    src/components/sections/ContactForm.tsx and submits straight to this
    file's path ("/__forms.html") with a matching form-name field.
  -->
  <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="firstName" />
    <input type="text" name="lastName" />
    <input type="text" name="company" />
    <input type="email" name="email" />
    <input type="tel" name="landline" />
    <input type="tel" name="mobile" />
    <input type="text" name="productSystem" />
    <input type="text" name="solution" />
    <textarea name="projectDescription"></textarea>
    <input type="text" name="bot-field" />
  </form>
</body>
</html>
